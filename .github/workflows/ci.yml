name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Pasang MariaDB (tes database, hanya Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server redis-server
          sudo systemctl stop mariadb || true
          sudo systemctl stop redis-server || true
          sudo ln -sf /usr/sbin/mariadbd /usr/local/bin/mariadbd
      - run: npm ci
      - run: npm run check
      - run: npm test
